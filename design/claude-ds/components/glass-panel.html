<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>co · glass panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#f3efe7;font:400 15px/1.5 "Schibsted Grotesk",sans-serif;color:#221d13;
  padding:40px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:50%;height:70%;left:-10%;top:-10%;background:#f6c69a;
  border-radius:50%;filter:blur(70px);opacity:.6}
.glass{position:relative;background:rgba(255,255,252,.55);backdrop-filter:blur(28px) saturate(150%);
  -webkit-backdrop-filter:blur(28px) saturate(150%);border-radius:24px;border:1px solid rgba(255,255,255,.7);
  border-bottom-color:rgba(255,255,255,.35);box-shadow:0 20px 50px rgba(80,60,20,.10),inset 0 1px 0 rgba(255,255,255,.8);
  padding:18px;max-width:480px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8d8474;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid rgba(50,40,20,.08)}
.row:first-of-type{border-top:0}
.rt{flex:1;font-size:15px;font-weight:600}
.rs{font-size:12.5px;color:#8d8474;font-weight:400}
.chip{font-size:12px;font-weight:600;border:0;border-radius:99px;padding:7px 13px;background:#221d13;color:#fff}
.chip.q{background:rgba(34,29,19,.06);color:#221d13}
</style></head><body>
<div class="glass">
  <div class="eyebrow">needs you · 2</div>
  <div class="row"><div style="flex:1"><div class="rt">subscription renews friday, $84</div><div class="rs">caught in your inbox</div></div>
    <button class="chip">keep</button><button class="chip q">cancel</button></div>
  <div class="row"><div style="flex:1"><div class="rt">thursday 8pm still open?</div><div class="rs">you said this week</div></div>
    <button class="chip">hold it</button><button class="chip q">not yet</button></div>
</div>
</body></html>
