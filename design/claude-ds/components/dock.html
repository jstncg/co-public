<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>co · the dock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#f3efe7;font:400 15px "Schibsted Grotesk",sans-serif;color:#221d13;
  padding:60px 24px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:60%;height:80%;right:-15%;top:-20%;background:#bcd4e6;
  border-radius:50%;filter:blur(70px);opacity:.6}
.dock{position:relative;width:min(520px,100%);display:flex;align-items:center;gap:8px;
  background:rgba(255,255,252,.62);backdrop-filter:blur(32px) saturate(160%);
  -webkit-backdrop-filter:blur(32px) saturate(160%);border:1px solid rgba(255,255,255,.7);
  border-radius:99px;padding:8px 8px 8px 18px;
  box-shadow:0 24px 60px rgba(60,42,12,.18),inset 0 1px 0 rgba(255,255,255,.9)}
.dock input{flex:1;background:none;border:0;outline:none;font:500 15px "Schibsted Grotesk",sans-serif;color:#221d13}
.dock input::placeholder{color:#8d8474}
.jump{display:flex;gap:2px}
.jump a{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;color:#8d8474;text-decoration:none;font-size:15px}
.jump a:hover{background:rgba(34,29,19,.07);color:#221d13}
.send{width:38px;height:38px;border-radius:99px;border:0;background:#221d13;color:#fff;font-size:16px}
</style></head><body>
<div class="dock">
  <input placeholder="ask, add, or find anything…">
  <div class="jump"><a href="#" title="needs you">●</a><a href="#" title="on your behalf">◐</a><a href="#" title="the record">○</a></div>
  <button class="send">↑</button>
</div>
</body></html>
